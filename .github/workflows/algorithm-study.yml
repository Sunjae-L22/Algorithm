name: Algorithm study workflow

on:
  push:
    paths: ['study-workflow/**', '백준/**', 'blog-workflow/config.json', '.github/workflows/algorithm-study.yml']
  pull_request:
    paths: ['study-workflow/**', '백준/**', 'blog-workflow/config.json', '.github/workflows/algorithm-study.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r study-workflow/requirements-blog.txt
      - run: python -m unittest discover -s study-workflow/tests -v
      - run: python study-workflow/scripts/study.py check
